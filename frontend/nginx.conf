server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API. The browser asks nginx for /api/..., nginx forwards it
    # to the backend container over the internal network. `backend` is the
    # Compose service name, resolved by Docker's DNS.
    #
    # NOTE: no trailing slash on proxy_pass. Without one the full path
    # (/api/auth/login) passes through, which is what the backend expects.
    # Add a slash and nginx STRIPS /api, 404ing every request.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite hashes asset filenames, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns the URLs. /dashboard matches no file on disk, so fall
    # back to index.html and let the JS router handle it. This is what
    # vercel.json's rewrite does.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
