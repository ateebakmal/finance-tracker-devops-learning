services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finance-tracker#
    volumes:
      - ft-data:/var/lib/posgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_tracker"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ft-backend:compose

    env_file: ./backend/.env
    environment: DATABASE_URL:postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/finance_tracker

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.direct
      args:
        VITE_API_URL: ${VITE_API_URL}

    image: ft-frontend:compose

    ports:
      - "3000:4173"

    depends_on:
      - backend

volumes:
  ft-data:
